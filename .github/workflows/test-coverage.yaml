on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    uses: CTTIR/.github/.github/workflows/test-coverage.yaml@main
    with:
      # Hosted baseline: 93.30%; native-boundary candidate: above 93%.
      # Leave a small platform margin while enforcing regression protection.
      floor: 90
    secrets: inherit
